<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ivan Wong — CV</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    html { font-size: 9px; line-height: 1.35; }

    /* ── Page setup ── */
    @page { size: A4; margin: 0; }

    /* ══════════════════════════════════════════
       TOOLBAR (no-print)
    ══════════════════════════════════════════ */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .toolbar.dark-toolbar {
      background: #0F172A;
      border-bottom: 1px solid #334155;
    }
    .toolbar.light-toolbar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    /* Toggle tabs */
    .version-tabs {
      display: flex;
      gap: 4px;
      background: rgba(0,0,0,0.15);
      border-radius: 9999px;
      padding: 3px;
    }
    .light-toolbar .version-tabs { background: #f1f5f9; }
    .version-tab {
      padding: 4px 14px;
      border-radius: 9999px;
      border: none;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'JetBrains Mono', monospace;
    }
    .version-tab.active-dark {
      background: #00FFFF;
      color: #0F172A;
    }
    .version-tab.inactive-dark {
      background: transparent;
      color: #94A3B8;
    }
    .version-tab.inactive-dark:hover { color: #F8FAFC; }
    .version-tab.active-light {
      background: #1e293b;
      color: #ffffff;
    }
    .version-tab.inactive-light {
      background: transparent;
      color: #64748b;
    }
    .version-tab.inactive-light:hover { color: #1e293b; }

    .toolbar-label {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
    }
    .dark-toolbar .toolbar-label { color: #94A3B8; }
    .light-toolbar .toolbar-label { color: #64748b; }

    .print-btn {
      border: none;
      padding: 6px 20px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }
    .dark-toolbar .print-btn {
      background: #00FFFF;
      color: #0F172A;
    }
    .dark-toolbar .print-btn:hover { box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
    .light-toolbar .print-btn {
      background: #1e293b;
      color: #ffffff;
    }
    .light-toolbar .print-btn:hover { box-shadow: 0 4px 14px rgba(30,41,59,0.25); }

    @media print {
      .toolbar { display: none !important; }
    }

    /* Language switcher (cv toolbar) */
    .lang-switch-cv {
      display: inline-flex;
      align-items: center;
      border-radius: 9999px;
      padding: 3px;
      gap: 2px;
    }
    .dark-toolbar .lang-switch-cv { background: rgba(0,0,0,0.15); }
    .light-toolbar .lang-switch-cv { background: #f1f5f9; }
    .lang-switch-cv button {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border: none;
      border-radius: 9999px;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dark-toolbar .lang-switch-cv button { color: #94A3B8; }
    .dark-toolbar .lang-switch-cv button:hover { color: #F8FAFC; }
    .dark-toolbar .lang-switch-cv button.active {
      background: #00FFFF;
      color: #0F172A;
    }
    .light-toolbar .lang-switch-cv button { color: #64748b; }
    .light-toolbar .lang-switch-cv button:hover { color: #1e293b; }
    .light-toolbar .lang-switch-cv button.active {
      background: #1e293b;
      color: #ffffff;
    }

    /* ══════════════════════════════════════════
       ██████  DARK / TERMINAL VERSION
    ══════════════════════════════════════════ */
    #cv-dark {
      background: #0F172A;
      color: #F8FAFC;
      font-family: 'JetBrains Mono', monospace;
    }

    #cv-dark :root,
    #cv-dark {
      --bg: #0F172A;
      --surface: rgba(30, 41, 59, 0.5);
      --border: #334155;
      --cyan: #00FFFF;
      --green: #22C55E;
      --purple: #8B5CF6;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }

    .cv-dark { padding: 4mm 5mm 2mm 5mm; }

    /* Dark header */
    .cv-dark .cv-header {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 6px;
    }
    .cv-dark .cv-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #00FFFF;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      margin-bottom: 2px;
    }
    .cv-dark .cv-header .subtitle {
      font-size: 9px;
      color: #94A3B8;
      margin-bottom: 5px;
    }
    .cv-dark .cv-header .subtitle .prompt { color: #22C55E; }
    .cv-dark .cv-header .contact {
      font-size: 8px;
      color: #94A3B8;
      line-height: 1.4;
    }
    .cv-dark .cv-header .contact .link { color: #00FFFF; }
    .cv-dark .cv-header .contact .sep { margin: 0 3px; }

    /* Dark section headings */
    .cv-dark .section-heading {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      color: #F8FAFC;
      border-bottom: 1px solid #334155;
      padding-bottom: 3px;
      margin: 14px 0 8px 0;
    }
    .cv-dark .section-heading .accent { color: #00FFFF; }
    .cv-dark .section-heading .prompt { color: #22C55E; font-family: 'JetBrains Mono', monospace; font-size: 9px; margin-right: 4px; }

    /* Dark card base */
    .cv-dark .card {
      background: rgba(30, 41, 59, 0.5);
      padding: 5px 10px;
      margin-bottom: 6px;
      border-radius: 0 6px 6px 0;
      border-left: 3px solid #334155;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .cv-dark .card.accent-cyan { border-left-color: #00FFFF; }
    .cv-dark .card.accent-purple { border-left-color: #8B5CF6; }
    .cv-dark .card.accent-green { border-left-color: #22C55E; }
    .cv-dark .card.full-border {
      border-left: none;
      border: 1px solid #334155;
      border-radius: 6px;
    }

    /* Dark typography */
    .cv-dark h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: #F8FAFC;
      margin-bottom: 1px;
    }
    .cv-dark .company { color: #00FFFF; font-size: 8px; font-weight: 600; }
    .cv-dark .duration { color: #94A3B8; font-size: 7px; margin-bottom: 3px; }
    .cv-dark .description { color: #94A3B8; font-size: 8px; line-height: 1.4; margin-bottom: 3px; }

    .cv-dark .bullets { list-style: none; }
    .cv-dark .bullets li {
      color: #94A3B8;
      font-size: 8px;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 4px;
      margin-bottom: 1px;
    }
    .cv-dark .bullets li .marker { color: #00FFFF; flex-shrink: 0; margin-top: 1px; }
    .cv-dark .bullets li .marker.green { color: #22C55E; }
    .cv-dark .bullets li .marker.purple { color: #8B5CF6; }
    .cv-dark .bullets li strong { color: #F8FAFC; font-weight: 500; }

    .cv-dark .tags { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
    .cv-dark .tag {
      font-size: 6px;
      padding: 0 3px;
      border-radius: 9999px;
      border: 1px solid #334155;
      color: #94A3B8;
      white-space: nowrap;
    }
    .cv-dark .tag.cyan { border-color: rgba(0, 255, 255, 0.3); color: #00FFFF; }
    .cv-dark .tag.purple { border-color: rgba(139, 92, 246, 0.3); color: #8B5CF6; }
    .cv-dark .tag.green { border-color: rgba(34, 197, 94, 0.3); color: #22C55E; }

    .cv-dark .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .cv-dark .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }

    .cv-dark .skill-category { margin-bottom: 4px; break-inside: avoid; page-break-inside: avoid; }
    .cv-dark .skill-category h3 {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      color: #94A3B8;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
    .cv-dark .skill-pills { display: flex; flex-wrap: wrap; gap: 2px; }
    .cv-dark .skill-pill {
      padding: 1px 5px;
      font-size: 7px;
      border-radius: 9999px;
      border: 1px solid #334155;
      background: rgba(30, 41, 59, 0.5);
      color: #F8FAFC;
    }

    .cv-dark .pub-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #F8FAFC;
      margin-bottom: 1px;
    }
    .cv-dark .pub-authors { color: #94A3B8; font-size: 8px; margin-bottom: 2px; }
    .cv-dark .pub-authors .first-author { color: #00FFFF; }
    .cv-dark .pub-venue { color: #94A3B8; font-size: 7px; margin-bottom: 3px; }
    .cv-dark .pub-abstract { color: #94A3B8; font-size: 8px; line-height: 1.4; }

    .cv-dark .edu-card {
      background: rgba(30, 41, 59, 0.5);
      padding: 5px 10px;
      border-left: 3px solid #8B5CF6;
      border-radius: 0 6px 6px 0;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .cv-dark .cert-card {
      background: rgba(30, 41, 59, 0.5);
      padding: 5px 10px;
      border-left: 3px solid #00FFFF;
      border-radius: 0 6px 6px 0;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .cv-dark .meta-box {
      font-size: 7px;
      color: #94A3B8;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 4px 6px;
      margin-top: 3px;
    }
    .cv-dark .meta-box .meta-line { display: flex; gap: 4px; }
    .cv-dark .meta-box .meta-key { color: #22C55E; min-width: 55px; }
    .cv-dark .meta-box .meta-val { color: #F8FAFC; }
    .cv-dark .meta-box .meta-status { color: #00FFFF; }

    .cv-dark .foxly-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: #F8FAFC;
      margin-bottom: 4px;
    }

    @media screen {
      .cv-dark { max-width: 210mm; margin: 0 auto; }
    }

    /* ══════════════════════════════════════════
       ████  FORMAL / LIGHT VERSION
    ══════════════════════════════════════════ */
    #cv-formal {
      background: #f8f9fb;
      color: #1a1f2e;
      font-family: 'Inter', sans-serif;
    }

    .cv-formal {
      padding: 4mm 5mm 2mm 5mm;
      background: #f8f9fb;
    }

    /* Formal color palette */
    /* Navy: #1e293b  |  Accent teal: #0ea5e9  |  Gold: #d97706  |  Muted: #64748b */

    /* Formal header — two-column, bold name left, contact right */
    .cv-formal .fml-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px 8px;
      margin-bottom: 8px;
      background: #1e293b;
      border-radius: 6px;
      break-inside: avoid;
    }
    .cv-formal .fml-header-left h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.3px;
      line-height: 1.1;
      margin-bottom: 3px;
    }
    .cv-formal .fml-header-left .fml-title {
      font-size: 9px;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .cv-formal .fml-header-right {
      text-align: right;
      font-size: 8px;
      color: #94a3b8;
      line-height: 1.8;
    }
    .cv-formal .fml-header-right .fml-link { color: #38bdf8; }

    /* Formal section heading — left-aligned with decorative bar */
    .cv-formal .fml-section-heading {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 13px 0 7px;
    }
    .cv-formal .fml-section-heading .fml-bar {
      width: 3px;
      height: 13px;
      background: linear-gradient(to bottom, #0ea5e9, #6366f1);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .cv-formal .fml-section-heading .fml-bar-gold {
      background: linear-gradient(to bottom, #d97706, #f59e0b);
    }
    .cv-formal .fml-section-heading h2 {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #1e293b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .cv-formal .fml-section-heading .fml-rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, #cbd5e1, transparent);
    }

    /* Formal experience card */
    .cv-formal .fml-exp-card {
      padding: 5px 10px 5px 12px;
      margin-bottom: 5px;
      border-left: 2px solid #e2e8f0;
      position: relative;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .cv-formal .fml-exp-card::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0ea5e9;
      border: 2px solid #f8f9fb;
    }
    .cv-formal .fml-exp-card.accent-gold { border-left-color: #d97706; }
    .cv-formal .fml-exp-card.accent-gold::before { background: #d97706; }

    .cv-formal .fml-exp-card h3 {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 1px;
    }
    .cv-formal .fml-exp-card .fml-company {
      font-size: 8px;
      font-weight: 600;
      color: #0ea5e9;
      margin-bottom: 1px;
    }
    .cv-formal .fml-exp-card .fml-duration {
      font-size: 7px;
      color: #94a3b8;
      margin-bottom: 3px;
      font-family: 'Inter', sans-serif;
    }
    .cv-formal .fml-exp-card .fml-bullets { list-style: none; }
    .cv-formal .fml-exp-card .fml-bullets li {
      font-size: 8px;
      color: #475569;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin-bottom: 1px;
    }
    .cv-formal .fml-exp-card .fml-bullets li::before {
      content: '–';
      color: #0ea5e9;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cv-formal .fml-exp-card .fml-bullets li strong { color: #1e293b; font-weight: 600; }

    /* Formal project cards */
    .cv-formal .fml-project-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      padding: 6px 10px;
      margin-bottom: 5px;
      break-inside: avoid;
      page-break-inside: avoid;
      border-top: 2px solid #0ea5e9;
    }
    .cv-formal .fml-project-card.accent-green { border-top-color: #10b981; }
    .cv-formal .fml-project-card.accent-violet { border-top-color: #7c3aed; }

    .cv-formal .fml-project-card h3 {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 1px;
    }
    .cv-formal .fml-project-card .fml-subtitle {
      font-size: 8px;
      font-weight: 600;
      color: #0ea5e9;
      margin-bottom: 2px;
    }
    .cv-formal .fml-project-card.accent-green .fml-subtitle { color: #10b981; }
    .cv-formal .fml-project-card.accent-violet .fml-subtitle { color: #7c3aed; }

    .cv-formal .fml-project-card .fml-desc {
      font-size: 8px;
      color: #64748b;
      line-height: 1.45;
      margin-bottom: 3px;
    }
    .cv-formal .fml-project-card .fml-pbullets { list-style: none; }
    .cv-formal .fml-project-card .fml-pbullets li {
      font-size: 7.5px;
      color: #475569;
      line-height: 1.4;
      display: flex;
      gap: 4px;
      margin-bottom: 1px;
    }
    .cv-formal .fml-project-card .fml-pbullets li::before {
      content: '›';
      font-weight: 700;
      flex-shrink: 0;
      color: #0ea5e9;
    }
    .cv-formal .fml-project-card.accent-green .fml-pbullets li::before { color: #10b981; }
    .cv-formal .fml-project-card.accent-violet .fml-pbullets li::before { color: #7c3aed; }

    .cv-formal .fml-tags { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; }
    .cv-formal .fml-tag {
      font-size: 6.5px;
      padding: 1px 5px;
      border-radius: 9999px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
      white-space: nowrap;
    }
    .cv-formal .fml-tag.cyan { background: #e0f7ff; border-color: #7dd3fc; color: #0369a1; }
    .cv-formal .fml-tag.green { background: #dcfce7; border-color: #86efac; color: #166534; }
    .cv-formal .fml-tag.purple { background: #ede9fe; border-color: #c4b5fd; color: #5b21b6; }

    /* Grid layouts */
    .cv-formal .fml-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .cv-formal .fml-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }

    /* Formal other-project card (compact) */
    .cv-formal .fml-other-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      padding: 5px 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .cv-formal .fml-other-card h3 {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 2px;
    }
    .cv-formal .fml-other-card .fml-desc {
      font-size: 7.5px;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 3px;
    }

    /* Formal publication */
    .cv-formal .fml-pub-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 3px solid #0ea5e9;
      border-radius: 0 5px 5px 0;
      padding: 6px 10px;
      break-inside: avoid;
    }
    .cv-formal .fml-pub-card .fml-pub-title {
      font-family: 'Inter', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 2px;
      line-height: 1.3;
    }
    .cv-formal .fml-pub-card .fml-pub-authors { font-size: 7.5px; color: #64748b; margin-bottom: 1px; }
    .cv-formal .fml-pub-card .fml-pub-authors .fml-author-highlight { color: #0ea5e9; font-weight: 600; }
    .cv-formal .fml-pub-card .fml-pub-venue { font-size: 7px; color: #94a3b8; margin-bottom: 3px; font-style: italic; }
    .cv-formal .fml-pub-card .fml-pub-abstract { font-size: 7.5px; color: #475569; line-height: 1.45; }

    /* Formal education / cert */
    .cv-formal .fml-edu-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      padding: 6px 10px;
      break-inside: avoid;
    }
    .cv-formal .fml-edu-card h3 {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 1px;
    }
    .cv-formal .fml-edu-card .fml-institution { font-size: 8px; color: #7c3aed; font-weight: 600; margin-bottom: 1px; }
    .cv-formal .fml-edu-card .fml-duration { font-size: 7px; color: #94a3b8; margin-bottom: 3px; }
    .cv-formal .fml-edu-card .fml-edu-bullets { list-style: none; }
    .cv-formal .fml-edu-card .fml-edu-bullets li {
      font-size: 7.5px;
      color: #475569;
      line-height: 1.4;
      display: flex;
      gap: 4px;
      margin-bottom: 1px;
    }
    .cv-formal .fml-edu-card .fml-edu-bullets li::before { content: '·'; color: #7c3aed; font-weight: 900; }

    .cv-formal .fml-cert-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 5px;
      padding: 6px 10px;
      break-inside: avoid;
    }
    .cv-formal .fml-cert-card h3 {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 1px;
    }
    .cv-formal .fml-cert-card .fml-duration { font-size: 7px; color: #60a5fa; }

    /* Formal skills */
    .cv-formal .fml-skill-category { margin-bottom: 5px; break-inside: avoid; page-break-inside: avoid; }
    .cv-formal .fml-skill-category h3 {
      font-size: 7.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
      margin-bottom: 3px;
    }
    .cv-formal .fml-skill-pills { display: flex; flex-wrap: wrap; gap: 2px; }
    .cv-formal .fml-skill-pill {
      padding: 1px 6px;
      font-size: 7px;
      border-radius: 9999px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      font-family: 'Inter', sans-serif;
    }

    /* Formal foxly/personal */
    .cv-formal .fml-personal-name {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 3px;
    }
    .cv-formal .fml-personal-desc {
      font-size: 8px;
      color: #64748b;
      line-height: 1.45;
      margin-bottom: 4px;
    }
    .cv-formal .fml-personal-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      padding: 5px 8px;
      break-inside: avoid;
    }
    .cv-formal .fml-personal-card h3 {
      font-size: 9px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 3px;
    }
    .cv-formal .fml-personal-card .fml-bullets { list-style: none; }
    .cv-formal .fml-personal-card .fml-bullets li {
      font-size: 7.5px;
      color: #475569;
      line-height: 1.4;
      display: flex;
      gap: 4px;
      margin-bottom: 1px;
    }
    .cv-formal .fml-personal-card .fml-bullets li::before { content: '›'; color: #0ea5e9; font-weight: 700; }
    .cv-formal .fml-personal-card .fml-bullets.gold li::before { color: #d97706; }

    @media screen {
      .cv-formal { max-width: 210mm; margin: 0 auto; }
      #cv-formal { padding-bottom: 20px; }
    }

  </style>
</head>
<body>

  <!-- ══════════════════════════════════════
       TOOLBAR
  ══════════════════════════════════════ -->
  <div class="toolbar dark-toolbar" id="toolbar">
    <span class="toolbar-label" id="toolbar-label">CV Preview — ivan.bz</span>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="version-tabs">
        <button class="version-tab active-light" id="tab-formal" onclick="switchVersion('formal')">Formal</button>
        <button class="version-tab inactive-light" id="tab-dark" onclick="switchVersion('dark')">Terminal</button>
      </div>
      <div class="lang-switch-cv" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-label="English">EN</button>
        <button type="button" data-lang="zh-CN" aria-label="简体中文" lang="zh-CN">简</button>
        <button type="button" data-lang="zh-TW" aria-label="繁體中文" lang="zh-TW">繁</button>
      </div>
    </div>
    <button class="print-btn" id="print-btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <!-- ══════════════════════════════════════
       DARK / TERMINAL CV
  ══════════════════════════════════════ -->
  <div id="cv-dark" style="display:none">
    <div class="cv-dark" id="cv-dark-inner">
      <div class="cv-header" id="cvd-header"></div>

      <div class="section-heading" id="cvd-sec-exp"><span class="prompt">&gt;_</span> <span class="accent" data-i18n="cvPage.secExperience">Experience</span></div>
      <div id="cvd-experience"></div>

      <div class="section-heading" id="cvd-sec-proj"><span class="prompt">&gt;_</span> <span data-i18n="cvPage.secWorkPrefix">Work</span> <span class="accent" data-i18n="cvPage.secWork">Projects</span></div>
      <div id="cvd-projects"></div>

      <div class="section-heading"><span class="prompt">&gt;_</span> <span data-i18n="cvPage.secPersonalPrefix">Personal</span> <span class="accent" data-i18n="cvPage.secPersonal">Projects</span></div>
      <div id="cvd-personal"></div>

      <div class="section-heading"><span class="prompt">&gt;_</span> <span class="accent" data-i18n="cvPage.secPublications">Publications</span></div>
      <div id="cvd-publications"></div>

      <div class="section-heading"><span class="prompt">&gt;_</span> <span data-i18n="cvPage.secEducationPrefix">Education &amp;</span> <span class="accent" data-i18n="cvPage.secEducationSuffix">Certifications</span></div>
      <div id="cvd-education"></div>

      <div class="section-heading"><span class="prompt">&gt;_</span> <span data-i18n="cvPage.secSkillsPrefix">Tech</span> <span class="accent" data-i18n="cvPage.secSkills">Stack</span></div>
      <div id="cvd-skills"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       FORMAL CV
  ══════════════════════════════════════ -->
  <div id="cv-formal">
    <div class="cv-formal" id="cv-formal-inner">
      <div id="cvf-header"></div>

      <div class="fml-section-heading">
        <div class="fml-bar"></div>
        <h2 data-i18n="cvPage.secFormalExperience">Experience</h2>
        <div class="fml-rule"></div>
      </div>
      <div id="cvf-experience"></div>

      <div class="fml-section-heading">
        <div class="fml-bar"></div>
        <h2 data-i18n="cvPage.secFormalWork">Work Projects</h2>
        <div class="fml-rule"></div>
      </div>
      <div id="cvf-projects"></div>

      <div class="fml-section-heading">
        <div class="fml-bar fml-bar-gold"></div>
        <h2 data-i18n="cvPage.secFormalPersonal">Personal Projects</h2>
        <div class="fml-rule"></div>
      </div>
      <div id="cvf-personal"></div>

      <div class="fml-section-heading">
        <div class="fml-bar"></div>
        <h2 data-i18n="cvPage.secFormalPublications">Publications</h2>
        <div class="fml-rule"></div>
      </div>
      <div id="cvf-publications"></div>

      <div class="fml-section-heading">
        <div class="fml-bar fml-bar-gold"></div>
        <h2 data-i18n="cvPage.secFormalEducation">Education &amp; Certifications</h2>
        <div class="fml-rule"></div>
      </div>
      <div id="cvf-education"></div>

      <div class="fml-section-heading">
        <div class="fml-bar"></div>
        <h2 data-i18n="cvPage.secFormalSkills">Technical Skills</h2>
        <div class="fml-rule"></div>
      </div>
      <div id="cvf-skills"></div>
    </div>
  </div>

  <script src="cv-data.js?v=20260909-2"></script>
  <script>
    // ── i18n state ─────────────────────────────────────────────────
    let currentLang = getLang();

    function applyStaticI18n() {
      const dict = I18N[currentLang] || I18N.en;
      function lookup(key) {
        return key.split('.').reduce((o, k) => (o && o[k] !== undefined) ? o[k] : undefined, dict);
      }
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const v = lookup(el.getAttribute('data-i18n'));
        if (v !== undefined) el.textContent = v;
      });
      // Buttons
      const printBtn = document.getElementById('print-btn');
      if (printBtn) printBtn.textContent = dict.cvPage.print;
      const tabFormal = document.getElementById('tab-formal');
      const tabDark = document.getElementById('tab-dark');
      if (tabFormal) tabFormal.textContent = dict.cvPage.tabFormal;
      if (tabDark) tabDark.textContent = dict.cvPage.tabDark;
      // Toolbar label
      updateToolbarLabel();
      // Active state on language buttons
      document.querySelectorAll('[data-lang]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
      });
      document.documentElement.setAttribute('lang', currentLang === 'en' ? 'en' : currentLang);
    }

    function updateToolbarLabel() {
      const dict = I18N[currentLang] || I18N.en;
      const isDark = currentVersion === 'dark';
      document.getElementById('toolbar-label').textContent = isDark
        ? dict.cvPage.toolbarLabelDark
        : dict.cvPage.toolbarLabelFormal;
    }

    function switchLanguage(lang) {
      if (!I18N[lang]) return;
      currentLang = lang;
      setLang(lang);
      applyStaticI18n();
      // Re-render both CV versions with new language
      const data = getLocalizedCvData(currentLang);
      loadDarkCV(data);
      loadFormalCV(data);
    }

    // ── Version switching ──────────────────────────────────────────
    let currentVersion = 'formal';

    function switchVersion(v) {
      currentVersion = v;
      const isDark = v === 'dark';

      document.getElementById('cv-dark').style.display = isDark ? '' : 'none';
      document.getElementById('cv-formal').style.display = isDark ? 'none' : '';

      const toolbar = document.getElementById('toolbar');
      toolbar.className = 'toolbar ' + (isDark ? 'dark-toolbar' : 'light-toolbar');

      const tabDark = document.getElementById('tab-dark');
      const tabFormal = document.getElementById('tab-formal');

      if (isDark) {
        tabDark.className = 'version-tab active-dark';
        tabFormal.className = 'version-tab inactive-dark';
      } else {
        tabDark.className = 'version-tab inactive-light';
        tabFormal.className = 'version-tab active-light';
      }

      updateToolbarLabel();

      document.body.style.background = isDark ? '#0F172A' : '#f8f9fb';
    }

    // ── Dark CV renderers ──────────────────────────────────────────
    function loadDarkCV(data) {
      renderDarkHeader(data.meta);
      renderDarkExperience(data.experience);
      renderDarkProjects(data.projects);
      renderDarkPersonal(data.personal);
      renderDarkSkills(data.skills);
      renderDarkPublications(data.publications);
      renderDarkEducation(data.education, data.certifications);
    }

    function renderDarkHeader(meta) {
      document.getElementById('cvd-header').innerHTML = `
        <h1>${meta.name}</h1>
        <div class="subtitle"><span class="prompt">&gt;_</span> ${meta.title}</div>
        <div class="contact">
          <span class="link">${meta.email}</span><span class="sep">&middot;</span>
          <span class="link">${meta.linkedin}</span><span class="sep">&middot;</span>
          <span class="link">${meta.website}</span><span class="sep">&middot;</span>
          ${meta.github}<span class="sep">&middot;</span>
          ${meta.location}
        </div>
      `;
    }

    function renderDarkExperience(experience) {
      const container = document.getElementById('cvd-experience');
      container.innerHTML = experience.map(exp => {
        if (exp.entries) {
          const items = exp.entries.map(e =>
            `<li><span class="marker">&#x25B8;</span><strong>${e.company}</strong> — ${e.description}</li>`
          ).join('');
          return `<div class="card accent-cyan">
            <h3>${exp.title}</h3>
            <div class="duration">${exp.duration}</div>
            <ul class="bullets">${items}</ul>
          </div>`;
        }
        const bullets = exp.bullets.map(b =>
          `<li><span class="marker">&#x25B8;</span>${b}</li>`
        ).join('');
        return `<div class="card accent-cyan">
          <div class="company">${exp.company}</div>
          <h3>${exp.title}</h3>
          <div class="duration">${exp.duration} &middot; ${exp.location}</div>
          <ul class="bullets">${bullets}</ul>
        </div>`;
      }).join('');
    }

    function renderDarkProjects(projects) {
      const container = document.getElementById('cvd-projects');
      const featured = projects.featured.map(p => {
        const bullets = p.bullets.map(b =>
          `<li><span class="marker" style="color:var(--${p.accentColor})">$</span>${b}</li>`
        ).join('');
        const tags = p.tags.map(t =>
          `<span class="tag ${t.color}">${t.label}</span>`
        ).join('');
        return `<div class="card accent-${p.accentColor}">
          <h3>${p.title}</h3>
          <div class="duration" style="color:var(--${p.accentColor})">${p.subtitle}</div>
          <div class="description">${p.description}</div>
          <ul class="bullets">${bullets}</ul>
          <div class="tags">${tags}</div>
        </div>`;
      }).join('');

      const other = projects.other.map(p => {
        const tags = p.tags.map(t =>
          `<span class="tag ${t.color}">${t.label}</span>`
        ).join('');
        return `<div class="card">
          <h3>${p.title}</h3>
          <div class="description">${p.description}</div>
          <div class="tags">${tags}</div>
        </div>`;
      }).join('');

      container.innerHTML = featured + `<div class="grid-2" style="margin-top:4px">${other}</div>`;
    }

    function renderDarkPersonal(personal) {
      const container = document.getElementById('cvd-personal');
      const details = personal.details.map(d => {
        const bullets = d.bullets.map(b =>
          `<li><span class="marker ${d.accentColor}">$</span>${b}</li>`
        ).join('');
        return `<div class="card accent-${d.accentColor}">
          <h3>${d.title}</h3>
          <ul class="bullets">${bullets}</ul>
        </div>`;
      }).join('');
      const tags = personal.tags.map(t =>
        `<span class="tag ${t.color}">${t.label}</span>`
      ).join('');
      container.innerHTML = `
        <div class="foxly-name">${personal.name}</div>
        <div class="description" style="margin-bottom:4px">${personal.description}</div>
        <div class="grid-2">${details}</div>
        <div class="tags" style="margin-top:3px">${tags}</div>
      `;
    }

    function renderDarkSkills(skills) {
      const container = document.getElementById('cvd-skills');
      container.innerHTML = `<div class="grid-2">${skills.map(cat => {
        const pills = cat.items.map(item =>
          `<span class="skill-pill">${item.name}</span>`
        ).join('');
        return `<div class="skill-category">
          <h3>${cat.categoryKey}</h3>
          <div class="skill-pills">${pills}</div>
        </div>`;
      }).join('')}</div>`;
    }

    function renderDarkPublications(publications) {
      const container = document.getElementById('cvd-publications');
      const venueSuffix = (I18N[currentLang] || I18N.en).publications.venueSuffix;
      container.innerHTML = publications.map(pub => {
        const authorHtml = pub.authors.replace(
          /(Ivan Tsz Fung Wong)/,
          '<span class="first-author">$1</span>'
        );
        return `<div class="card full-border" style="border-top: 3px solid var(--cyan);">
          <div class="pub-title">${pub.title}</div>
          <div class="pub-authors">${authorHtml}</div>
          <div class="pub-venue">${pub.status} — ${pub.conference}<br>${pub.publisher} &middot; ${venueSuffix}</div>
          <div class="pub-abstract">${pub.abstract}</div>
        </div>`;
      }).join('');
    }

    function renderDarkEducation(education, certifications) {
      const container = document.getElementById('cvd-education');
      const eduCards = education.map(edu => {
        const details = edu.details.map(d =>
          `<li><span class="marker purple">&#x25B8;</span>${d}</li>`
        ).join('');
        return `<div class="edu-card">
          <h3>${edu.degree}</h3>
          <div class="duration">${edu.institution}</div>
          <div class="duration">${edu.duration}</div>
          <ul class="bullets">${details}</ul>
        </div>`;
      }).join('');
      const certCards = certifications.map(cert =>
        `<div class="cert-card">
          <h3>${cert.name}</h3>
          <div class="duration">${cert.validity}</div>
        </div>`
      ).join('');
      container.innerHTML = `<div class="grid-2">${eduCards}</div><div style="margin-top:4px">${certCards}</div>`;
    }

    // ── Formal CV renderers ────────────────────────────────────────
    function loadFormalCV(data) {
      renderFormalHeader(data.meta);
      renderFormalExperience(data.experience);
      renderFormalProjects(data.projects);
      renderFormalPersonal(data.personal);
      renderFormalPublications(data.publications);
      renderFormalEducation(data.education, data.certifications);
      renderFormalSkills(data.skills);
    }

    function renderFormalHeader(meta) {
      document.getElementById('cvf-header').innerHTML = `
        <div class="fml-header">
          <div class="fml-header-left">
            <h1>${meta.name}</h1>
            <div class="fml-title">${meta.title}</div>
          </div>
          <div class="fml-header-right">
            <div><span class="fml-link">${meta.email}</span></div>
            <div><span class="fml-link">${meta.linkedin}</span></div>
            <div><span class="fml-link">${meta.website}</span></div>
            <div>${meta.github}</div>
            <div>${meta.location}</div>
          </div>
        </div>
      `;
    }

    function renderFormalExperience(experience) {
      const container = document.getElementById('cvf-experience');
      container.innerHTML = experience.map(exp => {
        if (exp.entries) {
          const items = exp.entries.map(e =>
            `<li><strong>${e.company}</strong> — ${e.description}</li>`
          ).join('');
          return `<div class="fml-exp-card">
            <h3>${exp.title}</h3>
            <div class="fml-duration">${exp.duration}</div>
            <ul class="fml-bullets">${items}</ul>
          </div>`;
        }
        const bullets = exp.bullets.map(b => `<li>${b}</li>`).join('');
        return `<div class="fml-exp-card">
          <div class="fml-company">${exp.company}</div>
          <h3>${exp.title}</h3>
          <div class="fml-duration">${exp.duration} &middot; ${exp.location}</div>
          <ul class="fml-bullets">${bullets}</ul>
        </div>`;
      }).join('');
    }

    const fmlAccentMap = { cyan: '', green: 'accent-green', purple: 'accent-violet' };

    function renderFormalProjects(projects) {
      const container = document.getElementById('cvf-projects');

      const featured = projects.featured.map(p => {
        const accentClass = fmlAccentMap[p.accentColor] || '';
        const bullets = p.bullets.map(b => `<li>${b}</li>`).join('');
        const tags = p.tags.map(t =>
          `<span class="fml-tag ${t.color}">${t.label}</span>`
        ).join('');
        return `<div class="fml-project-card ${accentClass}">
          <h3>${p.title}</h3>
          <div class="fml-subtitle">${p.subtitle}</div>
          <div class="fml-desc">${p.description}</div>
          <ul class="fml-pbullets">${bullets}</ul>
          <div class="fml-tags">${tags}</div>
        </div>`;
      }).join('');

      const other = projects.other.map(p => {
        const tags = p.tags.map(t =>
          `<span class="fml-tag ${t.color}">${t.label}</span>`
        ).join('');
        return `<div class="fml-other-card">
          <h3>${p.title}</h3>
          <div class="fml-desc">${p.description}</div>
          <div class="fml-tags">${tags}</div>
        </div>`;
      }).join('');

      container.innerHTML = featured + `<div class="fml-grid-2" style="margin-top:5px">${other}</div>`;
    }

    function renderFormalPersonal(personal) {
      const container = document.getElementById('cvf-personal');
      const details = personal.details.map((d, i) => {
        const bullets = d.bullets.map(b => `<li>${b}</li>`).join('');
        const goldClass = i === 1 ? 'gold' : '';
        return `<div class="fml-personal-card">
          <h3>${d.title}</h3>
          <ul class="fml-bullets ${goldClass}">${bullets}</ul>
        </div>`;
      }).join('');
      const tags = personal.tags.map(t =>
        `<span class="fml-tag ${t.color}">${t.label}</span>`
      ).join('');
      container.innerHTML = `
        <div class="fml-personal-name">${personal.name} <span style="font-weight:400;color:#64748b;font-size:8px">— ${personal.url.replace('https://','').replace(/\/$/,'')}</span></div>
        <div class="fml-personal-desc">${personal.description}</div>
        <div class="fml-grid-2">${details}</div>
        <div class="fml-tags" style="margin-top:4px">${tags}</div>
      `;
    }

    function renderFormalPublications(publications) {
      const container = document.getElementById('cvf-publications');
      container.innerHTML = publications.map(pub => {
        const authorHtml = pub.authors.replace(
          /(Ivan Tsz Fung Wong)/,
          '<span class="fml-author-highlight">$1</span>'
        );
        return `<div class="fml-pub-card">
          <div class="fml-pub-title">${pub.title}</div>
          <div class="fml-pub-authors">${authorHtml}</div>
          <div class="fml-pub-venue">${pub.status} — ${pub.conference} &middot; ${pub.publisher} &middot; 2026</div>
          <div class="fml-pub-abstract">${pub.abstract}</div>
        </div>`;
      }).join('');
    }
    // Note: formal skill category uses `cat.category` (translated); dark version
    // uses `cat.categoryKey` (terminal-style key, kept in English).

    function renderFormalEducation(education, certifications) {
      const container = document.getElementById('cvf-education');
      const eduCards = education.map(edu => {
        const details = edu.details.map(d => `<li>${d}</li>`).join('');
        return `<div class="fml-edu-card">
          <h3>${edu.degree}</h3>
          <div class="fml-institution">${edu.institution}</div>
          <div class="fml-duration">${edu.duration}</div>
          <ul class="fml-edu-bullets">${details}</ul>
        </div>`;
      }).join('');
      const certCards = certifications.map(cert =>
        `<div class="fml-cert-card">
          <h3>${cert.name}</h3>
          <div class="fml-duration">${cert.validity}</div>
        </div>`
      ).join('');
      container.innerHTML = `<div class="fml-grid-2">${eduCards}</div><div style="margin-top:5px">${certCards}</div>`;
    }

    function renderFormalSkills(skills) {
      const container = document.getElementById('cvf-skills');
      container.innerHTML = `<div class="fml-grid-2">${skills.map(cat => {
        const pills = cat.items.map(item =>
          `<span class="fml-skill-pill">${item.name}</span>`
        ).join('');
        return `<div class="fml-skill-category">
          <h3>${cat.category}</h3>
          <div class="fml-skill-pills">${pills}</div>
        </div>`;
      }).join('')}</div>`;
    }

    // ── Bootstrap ──────────────────────────────────────────────────
    const data = getLocalizedCvData(currentLang);
    loadDarkCV(data);
    loadFormalCV(data);

    // Set initial body bg and toolbar for formal-first
    document.body.style.background = '#f8f9fb';
    document.getElementById('toolbar').className = 'toolbar light-toolbar';

    // Apply static i18n strings (toolbar label, tab labels, print btn, section headings)
    applyStaticI18n();

    // Wire up language switcher buttons
    document.querySelectorAll('[data-lang]').forEach(btn => {
      btn.addEventListener('click', () => {
        switchLanguage(btn.getAttribute('data-lang'));
      });
    });
  </script>
</body>
</html>
